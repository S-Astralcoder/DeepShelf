<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepshelf - Dashboard</title>

    <!-- Style -->
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Icon Script -->
    <script src="https://kit.fontawesome.com/fd488fa74c.js" crossorigin="anonymous"></script>
</head>
<body>
    <aside id="side-bar">
        <section id="logo">
            <p>Deepshelf</p>
        </section>
        <section id="side-options">
            <ul id="options">
                <li><i class="fa-solid fa-file"></i> Dashboard</li>
                <li><i class="fa-solid fa-chart-simple"></i> Status</li>
                <li><i class="fa-solid fa-gear"></i> Settings</li>
            </ul>
            <div id="profile-card">
                <img id="profile-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJbhN88I9CuUGPLDK9IAkwPQl5jV4JPQpyn3nvGDFqo8JFF8U3TEikCOUq&s=10" alt="profile-image">
                <div id="profile-info">
                    <p id="username">UserNmae</p>
                    <p id="tier">Free Tier</p>
                </div>
            </div>
        </section>
    </aside>
    <main id="main-box">
        <header id="search-bar">
            <input type="search" name="search-box" id="search-box">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
            <i class="fa-solid fa-sliders"></i>
        </header>
        <section id="middle-bar">
            <div id="dashboard-text">
                <p>Dashboard</p>
            </div>
            <div id="control-btn">
                <button><i class="fa-solid fa-circle-plus"></i> Add Book</button>
            </div>
        </section>
        <section id="content-box">

        </section>
        <template id="book-card-template">
            <section id="book-card">
                <div id="upper">
                    <div id="book-info">
                        <p id="title"></p>
                        <p id="description"></p>
                    </div>
                    <div id="card-options">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </div>
                </div>
                <div id="lower">
                    <ul id="tags">

                    </ul>
                    <div id="mark-options">
                        <div id="book-mark">
                            <i class="fa-solid fa-bookmark"></i>
                            <i class="fa-regular fa-bookmark"></i>
                        </div>
                        <div id="read-mark">
                            <i class="fa-solid fa-book-open-reader"></i>
                            <i class="fa-solid fa-book-open"></i>
                        </div>
                    </div>
                </div>
            </section>
        </template>
    </main>
</body>
</html>
