<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepShelf</title>


    <!-- Styles -->
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/register.css">

    <!-- Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet">

</head>
<body>
    <header id="header-nav">
        <div id="logo">
            <p>DeepShelf</p>
        </div>
        <nav id="nav-bar">
            <a href="index.html">Home</a>
            <a href="login.html" style="text-decoration: underline;">LogIn</a>
            <a href="index.html#feature">Features</a>
            <button id="nav-start-btn">Get Started</button>
        </nav>
    </header>
    <main>
        <div id="error-box" class="hidden" role="alert" aria-live="polite"></div>
        <section id="login-box">
            <div id="box-left">
                <p id="box-header">Welcome Back to DeepShelf</p>
                <p id="box-description">Your digital bookshelf, powered by meaning. Sign in to access your curated library, AI-generated summaries, and semantic search across your saved articles and books.</p>
            </div>
            <div id="box-right">
                <form action="#" method="post">
                    <label for="name">Username or Email</label>
                    <input type="text" id="name" name="username" placeholder="Enter your username or email" required autocomplete="username">
                    
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    
                    <button type="submit">Login</button>

                    <div id="alternative-options">
                        <a href="signup.html">Don't have an account? Sign up</a>
                        <a href="#">Forgot password?</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script src="js/register.js"></script>
</body>
</html>
