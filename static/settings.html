<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepshelf - Settings</title>

    <!-- Style -->
    <link rel="stylesheet" href="css/dashboard.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italianno&display=swap" rel="stylesheet">

    <!-- Icon Script -->
    <script src="https://kit.fontawesome.com/fd488fa74c.js" crossorigin="anonymous"></script>
</head>
<body>
    <aside id="side-bar">
        <section id="logo">
            <p>Deepshelf</p>
        </section>
        <section id="side-options">
            <ul id="options">
                <li><a href="dashboard.html"><i class="fa-solid fa-file"></i> Dashboard</a></li>
                <li><a href="status.html"><i class="fa-solid fa-chart-simple"></i> Status</a></li>
                <li class="active"><a href="settings.html"><i class="fa-solid fa-gear"></i> Settings</a></li>
            </ul>
            <div id="profile-card">
                <img id="profile-image" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJbhN88I9CuUGPLDK9IAkwPQl5jV4JPQpyn3nvGDFqo8JFF8U3TEikCOUq&s=10" alt="profile-image">
                <div id="profile-info">
                    <p id="username">UserNmae</p>
                    <p id="tier">Free Tier</p>
                </div>
            </div>
        </section>
    </aside>
    <main id="main-box">
        <section id="profile-box">
            <div id="upper-box">
                <div id="profile-box-info">
                    <p id="username"></p>
                    <p id="email"></p>
                </div>
                <div id="profile-image-box">
                    <img id="profile-image-setting" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJbhN88I9CuUGPLDK9IAkwPQl5jV4JPQpyn3nvGDFqo8JFF8U3TEikCOUq&s=10" alt="profile-image">
                </div>
            </div>
            <div id="lower-box">
                <div id="subscription-tier">
                    <p></p>
                </div>
            </div>
        </section>
        <section id="user-options">
            <button>Logout</button>
            <button>Clear Data</button>
        </section>
        <section id="export">
            <button>Export Data</button>
        </section>
    </main>
</body>
</html>
